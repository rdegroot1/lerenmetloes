<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Leren met Loes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%A6%84%3C/text%3E%3C/svg%3E">
<style>body{margin:0}</style>
</head>
<body>
<title>Leren met Loes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600&display=swap">
<style>
/* Layout: one screen, a forest-floor card in the middle, big tap targets for small fingers.
   Single bright look on purpose (a children's picture book), so no dark variant. */
:root {
  --sky: #dff1f7;
  --grass: #7cc36a;
  --leaf: #2f7d4a;
  --fox: #f07a2a;
  --sun: #ffcf3f;
  --paper: #fffdf6;
  --ink: #24312a;
  --soft: #6d7f73;
  --wrong: #e5574f;
  --font-word: "Andika", "Comic Sans MS", system-ui, sans-serif; /* Andika: made for beginning readers */
  --font-ui: "Fredoka", "Andika", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: linear-gradient(var(--sky) 0 62%, var(--grass) 62% 100%);
  color: var(--ink);
  font-family: var(--font-ui);
  padding-inline: 16px;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
  overflow-x: hidden;
}
.app { max-width: 640px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; gap: 16px; padding-block: 16px; }
.top { display: flex; align-items: center; gap: 12px; }
.home { border: 0; background: var(--paper); border-radius: 999px; width: 48px; height: 48px; font-size: 24px; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.12); flex: none; }
.dots { display: flex; gap: 5px; min-width: 0; flex: 1; justify-content: center; flex-wrap: wrap; }
.dot { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,.7); border: 2px solid rgba(47,125,74,.3); transition: transform .2s; }
.dot.done { background: var(--sun); border-color: #e0a800; }
.dot.now { transform: scale(1.3); border-color: var(--leaf); }
.stars-total { font-size: 20px; font-weight: 600; background: var(--paper); padding: 8px 14px; border-radius: 999px; box-shadow: 0 3px 0 rgba(0,0,0,.12); flex: none; font-variant-numeric: tabular-nums; }

.card { background: var(--paper); border-radius: 28px; padding: 24px 20px; box-shadow: 0 6px 0 rgba(36,49,42,.15); display: flex; flex-direction: column; align-items: center; gap: 20px; flex: 1; justify-content: center; }
.prompt { font-size: 20px; color: var(--soft); text-align: center; text-wrap: balance; margin: 0; }
.big-word { font-family: var(--font-word); font-size: clamp(64px, 18vw, 110px); line-height: 1; font-weight: 700; letter-spacing: .04em; margin: 0; }
.big-pic { font-size: clamp(90px, 28vw, 150px); line-height: 1; }
.speak { border: 0; background: var(--leaf); color: #fff; border-radius: 999px; font-family: var(--font-ui); font-size: 22px; padding: 12px 22px; cursor: pointer; box-shadow: 0 4px 0 #1d5531; display: inline-flex; align-items: center; gap: 8px; }
.speak.huge { font-size: 64px; padding: 24px 40px; }
.speak:active, .choice:active, .tile:active, .go:active { transform: translateY(3px); box-shadow: none; }

.choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; }
.choice { border: 3px solid #e6e2d3; background: #fff; border-radius: 22px; padding: 14px 6px; cursor: pointer; box-shadow: 0 4px 0 #e6e2d3; font-size: clamp(56px, 16vw, 88px); line-height: 1.1; min-height: 110px; }
.choice.text { font-family: var(--font-word); font-weight: 700; font-size: clamp(38px, 10vw, 56px); color: var(--ink); }
.choice.right { border-color: var(--grass); background: #eaf7e5; box-shadow: 0 4px 0 var(--grass); }
.choice.wrong { border-color: var(--wrong); animation: shake .4s; opacity: .5; }

.slots, .tiles { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.slot { width: clamp(60px, 18vw, 84px); height: clamp(72px, 21vw, 96px); border-radius: 16px; border: 3px dashed #c9c3ad; display: grid; place-items: center; font-family: var(--font-word); font-weight: 700; font-size: clamp(44px, 12vw, 64px); background: #fff; cursor: pointer; }
.slot.filled { border-style: solid; border-color: var(--fox); }
.slot.right { border-color: var(--grass); background: #eaf7e5; }
.slot.wrong { animation: shake .4s; border-color: var(--wrong); }
.tile { width: clamp(60px, 18vw, 84px); height: clamp(68px, 20vw, 92px); border: 0; border-radius: 16px; background: var(--sun); box-shadow: 0 5px 0 #d9a600; font-family: var(--font-word); font-weight: 700; font-size: clamp(44px, 12vw, 64px); color: var(--ink); cursor: pointer; }
.tile.used { visibility: hidden; }

.feedback { min-height: 40px; font-size: 28px; font-weight: 600; text-align: center; margin: 0; }
.feedback.good { color: var(--leaf); }
.feedback.try { color: var(--fox); }

.go { border: 0; background: var(--fox); color: #fff; font-family: var(--font-ui); font-weight: 600; font-size: 30px; padding: 16px 40px; border-radius: 999px; cursor: pointer; box-shadow: 0 5px 0 #b9561a; }
.card.map { justify-content: flex-start; gap: 14px; }
.map-head { flex-wrap: wrap; display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 12px; }
.book-btn { border: 0; background: var(--leaf); color: #fff; font-family: var(--font-ui); font-size: 22px; padding: 8px 16px; border-radius: 999px; cursor: pointer; box-shadow: 0 4px 0 #1d5531; display: inline-flex; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; }
.book-btn span { font-size: 18px; }

/* het levelpad: stenen die heen en weer slingeren, van boven naar beneden */
.path { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 420px; padding-block: 8px; background: radial-gradient(circle, #e9e3cc 3px, transparent 4px) center top / 100% 22px repeat-y; background-size: 22px 22px; background-position: center; }
.stop { position: relative; display: flex; align-items: center; gap: 12px; width: max-content; max-width: 100%; }
.stop.pos0 { align-self: center; } .stop.pos1 { align-self: flex-end; margin-right: 8%; } .stop.pos2 { align-self: center; } .stop.pos3 { align-self: flex-start; margin-left: 8%; }
.stone { width: 76px; height: 76px; flex: none; border-radius: 50%; border: 0; background: var(--sun); box-shadow: 0 6px 0 #d9a600; font-family: var(--font-ui); font-weight: 600; font-size: 34px; color: var(--ink); cursor: pointer; }
.stone.done { background: var(--grass); box-shadow: 0 6px 0 var(--leaf); color: #fff; }
.stone.locked { background: #e6e2d3; box-shadow: 0 6px 0 #cfc9b3; font-size: 26px; }
.stone.current { background: var(--fox); box-shadow: 0 6px 0 #b9561a; color: #fff; animation: bounce 1.4s ease-in-out infinite; }
.stone:active { transform: translateY(4px); box-shadow: none; }
.me { position: absolute; left: -10px; top: -14px; font-size: 34px; z-index: 1; pointer-events: none; }
.stop-label { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.stop-name { font-size: 18px; font-weight: 600; }
.stop-stars { color: var(--sun); font-size: 20px; letter-spacing: 2px; -webkit-text-stroke: .5px #c99700; }
.stop-stars i, .result-stars i, .pips i { font-style: normal; color: #e6e2d3; -webkit-text-stroke: 0; }
.stop-pics { font-size: 18px; }

.bar { width: 100%; max-width: 420px; height: 18px; border-radius: 999px; background: #eee9d6; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--grass); border-radius: 999px; transition: width .6s; }
.stickers { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px; width: 100%; }
.stickers.small { grid-template-columns: repeat(auto-fit, minmax(88px, 110px)); justify-content: center; }
.sticker { border: 3px dashed #d8d2bc; background: #fbf9f0; border-radius: 18px; padding: 8px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: var(--font-word); color: var(--soft); cursor: pointer; }
.sticker b { font-size: 40px; line-height: 1.1; font-weight: 700; }
.sticker span { font-size: 20px; font-weight: 700; }
.sticker.half b { opacity: .45; filter: grayscale(.7); }
.sticker.got { border: 3px solid var(--sun); background: #fff; color: var(--ink); box-shadow: 0 4px 0 #f1dd94; transform: rotate(-2deg); }
.sticker.got:nth-child(even) { transform: rotate(2deg); }
.pips { font-size: 11px; color: var(--grass); letter-spacing: 2px; }
.reset { border: 0; background: none; color: var(--soft); font-family: system-ui, sans-serif; font-size: 14px; text-decoration: underline; cursor: pointer; padding: 8px; }

.result-stars { display: flex; gap: 8px; font-size: clamp(70px, 20vw, 100px); line-height: 1; }
.result-stars span { color: #e6e2d3; }
.result-stars span.on { color: var(--sun); -webkit-text-stroke: 2px #d9a600; animation: starIn .5s both; }
.unlock { margin: 0; font-size: 24px; font-weight: 600; color: var(--leaf); }
.btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.go.alt { background: var(--leaf); box-shadow: 0 5px 0 #1d5531; font-size: 24px; }
@keyframes bounce { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
@keyframes starIn { from { transform: scale(0) rotate(-90deg); } to { transform: scale(1) rotate(0); } }
.title { font-family: var(--font-ui); font-size: clamp(40px, 11vw, 64px); margin: 0; color: var(--leaf); text-align: center; line-height: 1.05; }
.hello { font-size: 80px; line-height: 1; }
.parent { font-size: 14px; color: var(--soft); text-align: center; max-width: 40ch; margin: 0; font-family: system-ui, sans-serif; }

.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.confetti span { position: absolute; top: -40px; font-size: 32px; animation: fall 1.6s ease-in forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
@keyframes shake { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-8px) } 75% { transform: translateX(8px) } }
@keyframes pop { from { transform: scale(.6); opacity: 0 } to { transform: scale(1); opacity: 1 } }
.card > * { animation: pop .25s ease-out; }
button:focus-visible { outline: 4px solid var(--leaf); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.head-btns { display: flex; gap: 8px; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 420px; }
.tab { border: 3px solid #e6e2d3; background: #fff; border-radius: 18px; padding: 8px 4px; font-family: var(--font-ui); font-size: 18px; font-weight: 600; color: var(--soft); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; box-shadow: 0 4px 0 #e6e2d3; }
.tab b { font-size: 30px; line-height: 1.1; }
.tab.on { border-color: var(--fox); color: var(--ink); background: #fff3e8; box-shadow: 0 4px 0 #f3c39d; }
.voices { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; width: 100%; }
.voice { border: 3px solid #e6e2d3; background: #fff; border-radius: 22px; padding: 12px 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: var(--font-ui); font-size: 18px; font-weight: 600; color: var(--ink); box-shadow: 0 4px 0 #e6e2d3; }
.voice b { font-size: 56px; line-height: 1.1; }
.voice.on { border-color: var(--fox); background: #fff3e8; box-shadow: 0 4px 0 #f3c39d; transform: scale(1.04); }
.section { margin: 8px 0 0; align-self: flex-start; font-size: 22px; color: var(--leaf); }
.translate { margin: 0; font-family: var(--font-word); font-size: 30px; }
.en-word, .sum-text { font-family: var(--font-word); font-weight: 700; font-size: 28px; }
.choices.two { grid-template-columns: repeat(2, 1fr); max-width: 360px; }
.choice small { display: block; font-family: var(--font-ui); font-size: 20px; color: var(--soft); }
.choice.num { font-family: var(--font-ui); font-size: clamp(48px, 13vw, 72px); }
.choice.num small { font-size: 16px; letter-spacing: -2px; }
.count-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 380px; }
.thing { position: relative; border: 0; background: none; font-size: clamp(40px, 11vw, 56px); line-height: 1.1; padding: 4px; cursor: pointer; border-radius: 16px; }
.thing.counted { background: #eaf7e5; }
.thing.counted::after { content: attr(data-n); position: absolute; right: -2px; top: -4px; background: var(--leaf); color: #fff; font-family: var(--font-ui); font-size: 16px; font-weight: 600; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; }
.sum { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
.group { display: flex; flex-wrap: wrap; justify-content: center; max-width: 220px; font-size: clamp(34px, 9vw, 48px); line-height: 1.15; background: #f6f2e2; border-radius: 18px; padding: 6px 10px; }
.group .gone { position: relative; }
.group .gone::after { content: "✖"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--wrong); font-size: .8em; background: rgba(246,242,226,.6); border-radius: 50%; }
.op { font-size: 44px; font-weight: 600; color: var(--fox); }

.tabs { grid-template-columns: repeat(4, 1fr); }
.tabs.two { grid-template-columns: repeat(2, 1fr); max-width: 320px; }
.tabs .tab { font-size: 16px; }
.who-btn { border: 0; background: #fff; border-radius: 999px; padding: 6px 14px 6px 8px; font-family: var(--font-ui); font-size: 20px; font-weight: 600; color: var(--ink); cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.12); display: inline-flex; align-items: center; gap: 6px; }
.who-btn small { font-size: 15px; color: var(--fox); font-variant-numeric: tabular-nums; }
.players { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; width: 100%; }
.player { border: 3px solid #e6e2d3; background: #fff; border-radius: 24px; padding: 16px 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: var(--font-ui); color: var(--ink); box-shadow: 0 5px 0 #e6e2d3; }
.player b { font-size: 72px; line-height: 1.1; }
.player span { font-size: 26px; font-weight: 600; }
.player small { font-size: 15px; color: var(--soft); font-variant-numeric: tabular-nums; }
.player:active { transform: translateY(4px); box-shadow: none; }
.board { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; width: 100%; max-width: 460px; }
.row { display: grid; grid-template-columns: 40px 52px 1fr auto; align-items: center; gap: 10px; background: #fff; border: 3px solid #e6e2d3; border-radius: 20px; padding: 10px 14px; }
.row.mine { border-color: var(--fox); background: #fff3e8; }
.medal { font-size: 30px; text-align: center; font-weight: 600; color: var(--soft); }
.av { font-size: 42px; line-height: 1; }
.who { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.who b { font-size: 22px; }
.who small { font-size: 14px; color: var(--soft); }
.xpbar { height: 10px; border-radius: 999px; background: #eee9d6; overflow: hidden; }
.xpbar i { display: block; height: 100%; background: var(--fox); border-radius: 999px; }
.xp { font-size: 28px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; line-height: 1; }
.xp small { display: block; font-size: 13px; color: var(--soft); }
.xp-pop { color: var(--fox); font-size: .8em; white-space: nowrap; }
.xp-total { margin: 0; font-size: 26px; font-weight: 600; color: var(--fox); text-align: center; }
.xp-total small { display: block; font-size: 16px; color: var(--soft); font-weight: 500; }
.prompt.big { font-size: 24px; color: var(--ink); }
.map-wrap { width: 100%; display: flex; justify-content: center; }
svg.topo { width: 100%; height: auto; max-height: 56vh; border-radius: 18px; display: block; touch-action: manipulation; }
svg.topo .sea { fill: #cfe8f3; }
svg.topo .land-bg { fill: #e7e2d0; stroke: #fff; stroke-width: 1; vector-effect: non-scaling-stroke; }
svg.topo .reg { fill: #a9d48f; stroke: #fff; stroke-width: 1.4; vector-effect: non-scaling-stroke; cursor: pointer; transition: fill .15s; }
svg.topo .reg.hl { fill: var(--fox); }
svg.topo .reg.right { fill: var(--leaf); }
svg.topo .reg.wrong { animation: flash .7s; }
svg.topo .ring { fill: none; stroke: var(--fox); stroke-width: 4; stroke-dasharray: 6 4; pointer-events: none; }
svg.topo .dot { cursor: pointer; }
svg.topo .dot .hit { fill: transparent; }
svg.topo .dot .pin { fill: #fff; stroke: var(--ink); stroke-width: 3; }
svg.topo .dot.hl .pin { fill: var(--fox); }
svg.topo .dot.right .pin { fill: var(--leaf); }
svg.topo .dot.wrong .pin { animation: flash .7s; }
@keyframes flash { 0%, 60% { fill: var(--wrong); } 100% { } }
.choices.names { grid-template-columns: repeat(2, 1fr); }
.choice.name { font-family: var(--font-ui); font-size: clamp(18px, 4.8vw, 24px); font-weight: 600; color: var(--ink); min-height: 64px; padding: 10px 8px; }

.blocks { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.blocks span { min-width: 56px; padding: 6px 12px; border-radius: 14px; background: var(--sun); box-shadow: 0 4px 0 #d9a600; font-family: var(--font-word); font-weight: 700; font-size: 40px; text-align: center; }
.blocks.big span { font-size: clamp(40px, 11vw, 64px); min-width: 0; padding: 6px 14px; }
.blocks { flex-wrap: nowrap; }
.die { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 150px; height: 150px; padding: 18px; background: #fff; border: 4px solid var(--ink); border-radius: 26px; box-shadow: 0 6px 0 rgba(36,49,42,.2); box-sizing: border-box; }
.die span { border-radius: 50%; }
.die .pip { background: var(--ink); }
.choice.group-choice { font-size: 30px; min-height: 140px; display: flex; align-items: center; justify-content: center; }
.pile { display: flex; flex-wrap: wrap; justify-content: center; max-width: 150px; line-height: 1.15; }
.split-house { display: flex; flex-direction: column; align-items: center; width: 220px; }
.split-house .roof { width: 220px; height: 80px; border: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); background: var(--fox); color: #fff; font-size: 40px; font-weight: 600; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; box-sizing: border-box; }
.split-house.heart .roof { background: var(--wrong); }
.split-house .rooms { display: grid; grid-template-columns: 1fr 1fr; width: 200px; border: 4px solid var(--ink); border-top: 0; background: #fff; }
.split-house .rooms span { font-size: 52px; font-weight: 600; text-align: center; padding: 10px 0; }
.split-house .rooms span + span { border-left: 4px solid var(--ink); }
.split-house .q { color: var(--soft); }
.split-house .q.ok { color: var(--leaf); }
.goals { display: grid; gap: 8px; width: 100%; }
.goal { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; background: #fff; border: 3px solid #e6e2d3; border-radius: 18px; padding: 10px 12px; }
.goal.behaald { border-color: var(--grass); background: #f1f9ec; }
.g-icon { font-size: 22px; text-align: center; }
.g-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.g-text b { font-size: 17px; font-weight: 600; line-height: 1.2; }
.g-text small { font-size: 13px; color: var(--soft); }
.goal .xpbar i { background: var(--grass); }
.g-go { border: 0; background: var(--leaf); color: #fff; font-family: var(--font-ui); font-size: 16px; font-weight: 600; padding: 8px 12px; border-radius: 999px; cursor: pointer; box-shadow: 0 3px 0 #1d5531; }
.code { width: 100%; min-height: 84px; box-sizing: border-box; border: 3px solid #e6e2d3; border-radius: 16px; padding: 10px; font: 13px/1.3 ui-monospace, Menlo, monospace; color: var(--ink); background: #fff; resize: vertical; word-break: break-all; user-select: text; -webkit-user-select: text; }
.parent.big { font-size: 16px; color: var(--ink); max-width: 46ch; }

.mc-q { margin: 0; font-size: clamp(24px, 6vw, 34px); font-weight: 600; text-align: center; text-wrap: balance; line-height: 1.25; }
.mc-q .gap { color: var(--fox); }
.uitleg { margin: 0; max-width: 42ch; font-size: 17px; color: var(--ink); background: #fff8dc; border-radius: 14px; padding: 10px 14px; text-align: center; }
.brand { font-family: var(--font-ui); font-weight: 600; font-size: 22px; color: var(--fox); letter-spacing: .01em; }

/* Magische Leren-met-Loes huisstijl */
:root{--sky:#dff4ff;--grass:#d7c8ff;--leaf:#7657c8;--fox:#ef72aa;--sun:#ffd85a;--paper:#fffaff;--ink:#493d67;--soft:#756b8e;--wrong:#e85d75}
body{background:radial-gradient(circle at 15% 10%,rgba(255,255,255,.95) 0 7%,transparent 7.5%),radial-gradient(circle at 82% 17%,rgba(255,255,255,.8) 0 5%,transparent 5.5%),linear-gradient(155deg,#ccefff 0%,#eee4ff 46%,#ffdff0 75%,#fff0b8 100%);background-attachment:fixed}
body::before{content:"✨  ☁️  🌈  ✨  ☁️";position:fixed;inset:18px 0 auto;text-align:center;font-size:25px;letter-spacing:22px;opacity:.55;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;max-width:680px;padding-block:22px}
.card{background:rgba(255,250,255,.94);border:2px solid rgba(255,255,255,.9);border-radius:36px;box-shadow:0 16px 42px rgba(91,63,140,.18),inset 0 1px 0 #fff;padding:28px 24px}
.card.map{background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(255,247,253,.95))}
.title{color:#704fc1;text-shadow:0 2px 0 #fff,0 4px 14px rgba(112,79,193,.14)}
.brand{color:#c44f91;font-size:24px}.brand::before{content:"🦄 ";}.brand::after{content:" ✨"}
.book-btn{background:linear-gradient(180deg,#8d70dc,#6e50bd);box-shadow:0 4px 0 #523a9a,0 8px 16px rgba(82,58,154,.18)}
.who-btn,.stars-total{box-shadow:0 5px 16px rgba(91,63,140,.13);border:2px solid #f0e8ff}
.tabs{gap:10px}.tab{border:2px solid #eadfff;border-radius:22px;background:linear-gradient(#fff,#fbf7ff);box-shadow:0 5px 0 #e5d9f7;padding:10px 5px}.tab.on{border-color:#ef72aa;background:linear-gradient(#fff5fb,#ffe9f5);box-shadow:0 5px 0 #f4bdd8;transform:translateY(-1px)}
.path{background:radial-gradient(circle,#e7d9ff 4px,transparent 4.5px) center top/24px 24px repeat-y;padding:16px 4px;gap:10px}
.stone{background:linear-gradient(145deg,#ffe978,#ffc94f);box-shadow:0 7px 0 #e6a93c,0 10px 20px rgba(140,99,40,.16);border:3px solid rgba(255,255,255,.9)}
.stone.done{background:linear-gradient(145deg,#a58ae9,#7759c8);box-shadow:0 7px 0 #583da6;color:#fff}.stone.current{background:linear-gradient(145deg,#ff9aca,#ec67a8);box-shadow:0 7px 0 #c34584;color:#fff}
.sticker{border-color:#ddcff5;background:linear-gradient(145deg,#fff,#fff5fb);border-radius:24px}.sticker.got{border-color:#ffd85a;background:linear-gradient(145deg,#fffef5,#fff3bf);box-shadow:0 7px 18px rgba(224,170,39,.2)}
.bar{background:#eee6f8}.bar span{background:linear-gradient(90deg,#ef72aa,#9a7be2,#66c7e8)}
.go{background:linear-gradient(180deg,#f486bc,#e35c9e);box-shadow:0 6px 0 #bd3f7c,0 10px 18px rgba(189,63,124,.18)}
.magic-hero{width:100%;max-width:500px;border-radius:28px;padding:18px 18px 16px;box-sizing:border-box;background:linear-gradient(135deg,#fff0fa,#f0e9ff 55%,#e4f8ff);border:2px solid #fff;box-shadow:0 9px 24px rgba(103,76,150,.14);display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.magic-unicorn{font-size:68px;filter:drop-shadow(0 5px 4px rgba(100,70,140,.16));animation:floaty 2.6s ease-in-out infinite}.magic-copy b{display:block;font-size:22px;color:#6c4fba;margin-bottom:4px}.magic-copy span{font-family:var(--font-word);font-size:16px;line-height:1.35;color:var(--soft)}
.magic-mission{width:100%;max-width:500px;box-sizing:border-box;border-radius:22px;padding:13px 16px;background:#fff9dc;border:2px solid #ffe59a;font-family:var(--font-word);font-size:16px;line-height:1.35;text-align:center;color:#665330}
.sticker-callout{width:100%;max-width:500px;box-sizing:border-box;border-radius:24px;padding:16px;background:linear-gradient(135deg,#fff1fa,#f2edff);border:2px solid #eadbff;text-align:center}.sticker-callout b{display:block;font-size:22px;color:#744fc4;margin-bottom:5px}.sticker-callout span{font-family:var(--font-word);font-size:16px;line-height:1.4;color:var(--soft)}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}
@media(max-width:520px){.magic-hero{grid-template-columns:1fr;text-align:center}.magic-unicorn{font-size:62px}.card{padding:22px 16px;border-radius:30px}.head-btns{gap:5px}.book-btn{padding:8px 11px}}

.app-hero{width:100%;max-width:560px;aspect-ratio:16/9;object-fit:cover;object-position:center;border-radius:28px;border:3px solid #fff;box-shadow:0 12px 28px rgba(88,57,137,.2);display:block}
.hero-wrap{width:100%;display:flex;justify-content:center;position:relative}.hero-wrap::after{content:"✨";position:absolute;right:5%;bottom:-8px;font-size:34px;filter:drop-shadow(0 3px 5px rgba(90,50,130,.2))}
@media(max-width:520px){.app-hero{aspect-ratio:16/8;border-radius:22px}.hero-wrap::after{font-size:27px}}

/* Familie-avatars uit de Magische Boomhuis illustratie */

function weekKey(d = new Date()) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y = t.getUTCFullYear();
  return y + "-W" + Math.ceil(((t - Date.UTC(y, 0, 1)) / 864e5 + 1) / 7);
}

function bewaarLokaal() { try { localStorage.setItem(OPSLAG, JSON.stringify({ spelers: ALLE })); } catch (e) {} }
const pushTimers = {}, writing = {}, again = {};
let db = null, scherm = "spelers";
function bewaar() {
  P.bijgewerkt = Date.now(); bewaarLokaal();
  const id = actief; if (!id) return;
  clearTimeout(pushTimers[id]); pushTimers[id] = setTimeout(() => push(id), 1200);
}
async function push(id) {
  if (!db) return;
  if (writing[id]) { again[id] = true; return; }
  writing[id] = true;
  try { await db.doc("gezin/" + id).set(JSON.parse(JSON.stringify(ALLE[id]))); }
  catch (e) { if (e && e.code === "unavailable") setTimeout(() => push(id), 2000 + Math.random() * 2000); }
  writing[id] = false;
  if (again[id]) { again[id] = false; push(id); }
}
async function koppel() {
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) return;
  if (!round && HERTEKEN[scherm]) HERTEKEN[scherm]();
  db.collection("gezin").onSnapshot(snap => {
    let changed = false; const seen = new Set();
    snap.docs.forEach(d => {
      if (!ALLE[d.id]) return;
      seen.add(d.id);
      const r = d.data() || {}, mine = ALLE[d.id];
      if ((r.bijgewerkt || 0) > (mine.bijgewerkt || 0)) {
        if (round && d.id === actief) return;   // tijdens een ronde wint dit apparaat
        ALLE[d.id] = Object.assign(leeg(), JSON.parse(JSON.stringify(r)));
        if (d.id === actief) P = ALLE[d.id];
        changed = true;
      } else if ((mine.bijgewerkt || 0) > (r.bijgewerkt || 0)) push(d.id);
    });
    SPELERS.forEach(s => { if (!seen.has(s.id) && ALLE[s.id].bijgewerkt) push(s.id); });
    if (changed) { bewaarLokaal(); if (!round && HERTEKEN[scherm]) HERTEKEN[scherm](); }
  }, () => {});
}

  const norm = v => (v.lang || "").replace("_", "-");
  let list = voices.filter(v => norm(v) === lang);
  if (!list.length) list = voices.filter(v => norm(v).startsWith(lang.slice(0, 2)));

}

    u.rate = rate || (soort === "praat" ? s.rate : 0.8);
    const v = voiceFor(lang, lang === "nl-NL" ? STEMMEN.indexOf(s) : 0);
    if (v) u.voice = v;

}

let ac = null;
function tone(freqs, dur = 0.12, type = "sine") {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = f;
      const t = ac.currentTime + i * dur;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur * 1.6);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur * 1.8);
    });
  } catch (e) {}
}

function maakCode() {

}
function leesCode(code) {
  const m = code.trim().replace(/\s+/g, "").match(/LOES1\.([A-Za-z0-9+/=]+)/);
  if (!m) return null;
  try { return JSON.parse(decodeURIComponent(escape(atob(m[1])))).spelers || null; } catch (e) { return null; }
}
// samenvoegen: van elk level, woordje en de XP telt de hoogste stand
function voegSamen(a, b) {
  const nieuw = (b.bijgewerkt || 0) > (a.bijgewerkt || 0) ? b : a;
  const r = Object.assign(leeg(), a, { stem: nieuw.stem, vak: nieuw.vak });
  r.levels = { ...a.levels }; for (const [k, v] of Object.entries(b.levels || {})) r.levels[k] = Math.max(r.levels[k] || 0, v);
  r.woorden = { ...a.woorden }; for (const [k, v] of Object.entries(b.woorden || {})) r.woorden[k] = Math.max(r.woorden[k] || 0, v);
  r.sterren = Math.max(a.sterren || 0, b.sterren || 0);
  r.xp = Math.max(a.xp || 0, b.xp || 0);
  const wk = weekKey(); r.week = wk; r.xpWeek = Math.max(weekXp(a), weekXp(b));
  r.bijgewerkt = Date.now();
  return r;
}

/* ===== TOPOGRAFIE ===== */
function topoVragen(L) {
  const lijst = L.steden || L.gebieden, items = shuffle(lijst);
  const n = Math.max(8, Math.min(12, items.length));
  return Array.from({ length: n }, (_, i) => ({
    type: "topo", kaart: L.kaart, lijst, steden: !!L.steden, naam: items[i % items.length],
    soort: L.soorten[(i + Math.floor(i / items.length)) % L.soorten.length],
  }));
}
function tekenKaart(k, opts = {}) {
  const m = KAART[k], wrap = el("div", "map-wrap");
  let s = `<svg viewBox="0 0 ${m.box[2]} ${m.box[3]}" class="topo"><rect class="sea" width="100%" height="100%"/><path class="land-bg" d="${m.bg}"/>`;
  for (const [n, d] of Object.entries(m.regions)) s += `<path class="reg${opts.highlight === n ? " hl" : ""}" data-n="${n}" d="${d}"/>`;
  const r = k === "nl" ? 8 : 9;
  (opts.dots || []).forEach(n => {
    const xy = m.steden[n]; if (!xy) return;
    s += `<g class="dot${opts.hlDot === n ? " hl" : ""}" data-n="${n}"><circle class="hit" cx="${xy[0]}" cy="${xy[1]}" r="${r * 2.4}"/><circle class="pin" cx="${xy[0]}" cy="${xy[1]}" r="${r}"/></g>`;
  });
  wrap.innerHTML = s + "</svg>";
  if (opts.onRegion) wrap.querySelectorAll(".reg").forEach(p => p.addEventListener("click", () => opts.onRegion(p.dataset.n, p)));
  if (opts.onDot) wrap.querySelectorAll(".dot").forEach(g => g.addEventListener("click", () => opts.onDot(g.dataset.n, g)));
  // kleine landen (Luxemburg) krijgen een cirkel eromheen
  if (opts.highlight) requestAnimationFrame(() => {
    const p = wrap.querySelector(".reg.hl"); if (!p) return;
    const b = p.getBBox(); if (b.width > 40 && b.height > 40) return;
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("class", "ring"); c.setAttribute("cx", b.x + b.width / 2); c.setAttribute("cy", b.y + b.height / 2); c.setAttribute("r", Math.max(b.width, b.height) / 2 + 14);
    wrap.querySelector("svg").append(c);
  });
  return wrap;
}
function flits(node) { node.classList.remove("wrong"); void node.getBoundingClientRect(); node.classList.add("wrong"); }
const naamOpties = (juist, pool, n = 4) => shuffle([juist, ...shuffle([...new Set(pool)].filter(x => x !== juist)).slice(0, n - 1)]);

/* ---------- ronde ---------- */
function maakVragen(vak, li) {

  if (L.mc) return shuffle(L.mc).slice(0, 10).map(([vraag, juist, fout, uitleg]) => ({ type: "mc", vraag, juist, opties: shuffle([juist, ...fout]), uitleg }));
  if (L.gen) return Array.from({ length: 10 }, (_, i) => hoofdreken(L.gen[i % L.gen.length]));
  if (vak === "rekenen") return Array.from({ length: 8 }, (_, i) => rekenVraag(L.soorten[i % L.soorten.length], L.tot));
  const types = vak === "lezen" ? ["kiesPlaatje", "hoorWoord", "bouwWoord"] : ["hoorEngels", "kloptHet"];
  const items = levelItems(vak, li);
  const qs = [];
  const add = (it, t) => qs.push({ type: types[t % types.length], item: it, sticker: stickerKey(vak, it) });
  if (L.alle) shuffle(items).slice(0, 10).forEach((it, j) => add(it, j));
  else {

    [0, 1].forEach(k => items.forEach((it, j) => add(it, j + k)));
    const oud = shuffle(VAKKEN[vak].levels.slice(0, li).flatMap((_, k) => levelItems(vak, k))).slice(0, HERHAAL_PER_RONDE);
    oud.forEach((it, j) => add(it, j + 2));
  }

}
/* hoofdrekenen voor volwassenen: een som met drie bijna-goede foute antwoorden */
function hoofdreken(soort) {
  let vraag, n, fout = [];
  if (soort === "tafel") { const a = rnd(6, 15), b = rnd(6, 15); vraag = `${a} × ${b}`; n = a * b; fout = [n + a, n - b, n + 10]; }
  else if (soort === "procent") { const p = pick([5, 10, 15, 20, 25, 30, 40, 75]), x = rnd(2, 40) * 20; vraag = `${p}% van ${x}`; n = p * x / 100; fout = [n * 2, n + x / 10, Math.round(n * 1.5)]; }
  else if (soort === "btw") { const x = rnd(1, 30) * 100; vraag = `€${x} plus 21% btw`; n = x * 1.21; fout = [x * 1.2, x * 1.12, x + 21]; }
  else if (soort === "korting") { const p = pick([10, 20, 25, 30, 40, 50]), x = rnd(2, 30) * 20; vraag = `€${x} met ${p}% korting`; n = x * (100 - p) / 100; fout = [x * p / 100, n - 10, n + 10]; }
  else if (soort === "breuk") { const [a, b] = pick([[1, 2], [1, 3], [2, 3], [1, 4], [3, 4], [1, 5], [2, 5], [3, 8]]), x = b * rnd(3, 30); vraag = `${a}/${b} van ${x}`; n = x / b * a; fout = [x / a * b, x / b, n + x / b]; }
  else { const a = rnd(11, 25); vraag = `${a}²`; n = a * a; fout = [a * 2, n + 10, n - a]; }
  const fmt = v => (Number.isInteger(v) ? String(v) : v.toFixed(2).replace(".", ",")) ;
  const zeker = [...new Set(fout.map(v => Math.round(v * 100) / 100).filter(v => v > 0 && v !== n))];
  while (zeker.length < 3) { const v = n + pick([-3, -2, -1, 1, 2, 3]) * (Number.isInteger(n) ? 1 : 0.5) * rnd(1, 4); if (v > 0 && v !== n && !zeker.includes(v)) zeker.push(v); }
  const juist = fmt(n);
  return { type: "mc", vraag: vraag + " = ?", juist, opties: shuffle([juist, ...zeker.slice(0, 3).map(fmt)]), uitleg: "" };
}

/* klanken: een woord in klankstukjes (aa, oo, ui, ij ... tellen als één klank) */
const klanken = w => w.match(/aa|ee|oo|uu|ui|ij|ei|oe|ou|au|ie|eu|ch|ng|./g);
const KLANK_WOORDEN = () => [...WOORDEN, ...EXTRA_WOORDEN];
const vindKlank = w => KLANK_WOORDEN().find(x => x.woord === w);
function klankVragen(soort) {
  const N = 8;
  if (soort === "rijm") {
    return shuffle(RIJMEN).concat(shuffle(RIJMEN)).slice(0, N).map(pr => {
      const [a, b] = Math.random() < 0.5 ? pr : [pr[1], pr[0]];
      const rijmt = new Set(pr);
      const andere = shuffle(KLANK_WOORDEN().filter(w => !rijmt.has(w.woord) && w.woord.slice(-2) !== a.slice(-2))).slice(0, 2);
      return { type: "rijm", doel: vindKlank(a), juist: vindKlank(b), opties: shuffle([vindKlank(b), ...andere]) };
    });
  }
  if (soort === "begin") {
    const groepen = {};
    WOORDEN.forEach(w => (groepen[klanken(w.woord)[0]] ||= []).push(w));
    const bruikbaar = WOORDEN.filter(w => groepen[klanken(w.woord)[0]].length > 1);
    return shuffle(bruikbaar).slice(0, N).map(w => {
      const k = klanken(w.woord)[0];
      const juist = pick(groepen[k].filter(x => x !== w && x.plaatje !== w.plaatje));
      const andere = shuffle(WOORDEN.filter(x => klanken(x.woord)[0] !== k)).slice(0, 2);
      return { type: "begin", doel: w, juist, opties: shuffle([juist, ...andere]) };
    });
  }
  // hak en plak: woordjes van 2 tot 4 klanken, altijd een paar korte en lange erbij
  const pool = [...WOORDEN, ...HAK_WOORDEN], len = w => klanken(w.woord).length;
  const kies = [...shuffle(pool.filter(w => len(w) === 2)).slice(0, 2), ...shuffle(pool.filter(w => len(w) === 4)).slice(0, 3), ...shuffle(pool.filter(w => len(w) === 3)).slice(0, N - 5)];
  return shuffle(kies).map(w => ({ type: soort, item: w, pool }));
}
function rekenVraag(soort, tot) {
  if (soort === "dobbel") return { type: "dobbel", n: rnd(1, 6), tot: 6 };
  if (soort === "meer") { const a = rnd(1, 9); let b = rnd(1, 9); while (b === a) b = rnd(1, 9); return { type: "meer", a, b, vraag: pick(["meer", "minder"]), ding: pick(DINGEN) }; }
  if (soort === "split" || soort === "hart") {
    const T = soort === "hart" ? 10 : rnd(tot <= 5 ? 2 : 5, tot), a = rnd(1, T - 1);
    return { type: "split", T, a, n: T - a, tot: T, hart: soort === "hart" };
  }
  if (soort === "plus") { const a = rnd(1, tot - 1), b = rnd(1, tot - a); return { type: "som", a, b, op: "+", n: a + b, tot }; }
  if (soort === "min") { const a = rnd(2, tot), b = rnd(1, Math.min(3, a - 1)); return { type: "som", a, b, op: "−", n: a - b, tot }; }
  return { type: soort, n: rnd(1, tot), tot, ding: pick(DINGEN) };
}
function startRound(vak, li) {

function keuzes(c, opties, juist, toon, opts = {}) {

  const ch = el("div", "choices" + (opties.length === 2 ? " two" : "") + (opts.grid ? " " + opts.grid : ""));

    b.onclick = () => {

}

      c.append(el("p", "prompt big", q.kaart === "nl" ? "Welke provincie is dit?" : "Welk land is dit?"));
      c.append(tekenKaart(q.kaart, { highlight: q.naam }));
      keuzes(c, naamOpties(q.naam, q.lijst.length >= 4 ? q.lijst : alleGebieden), q.naam, o => o, { cls: "name", grid: "names", goed: () => say(q.naam) });
    } else if (q.soort === "hoofdstad") {
      c.append(el("p", "prompt big", `Wat is de hoofdstad van <b>${q.naam}</b>?`));
      c.append(tekenKaart(q.kaart, { highlight: q.naam }));
      keuzes(c, naamOpties(stadVan, alleGebieden.map(g => HOOFDSTAD[g])), stadVan, o => o, { cls: "name", grid: "names", goed: () => say(stadVan) });
      say(`Wat is de hoofdstad van ${q.naam}?`);
    } else { // stadNaam
      c.append(el("p", "prompt big", "Welke stad is dit?"));
      c.append(tekenKaart(q.kaart, { dots: stippen, hlDot: stadVan }));
      keuzes(c, naamOpties(stadVan, stippen), stadVan, o => o, { cls: "name", grid: "names", goed: () => say(stadVan) });
    }
  },

  /* ===== REKENEN ===== */
  /* hoeveel zie je? tik ze om te tellen */
  tellen(q) {
    const c = $("card"); c.innerHTML = "";
    c.append(el("p", "prompt", "Hoeveel zie je? Tik ze aan om te tellen."));
    const grid = el("div", "count-grid");
    let geteld = 0;
    for (let k = 0; k < q.n; k++) {
      const d = el("button", "thing", q.ding);
      d.onclick = () => { if (d.classList.contains("counted")) return; geteld++; d.classList.add("counted"); d.dataset.n = geteld; tik(); sayGetal(geteld); };
      grid.append(d);
    }
    c.append(grid);
    keuzes(c, getalOpties(q.n, q.tot), q.n, o => o, { cls: "text num", goed: () => sayGetal(q.n), fout: o => sayGetal(o) });
  },
  /* welk getal hoor je? */
  getal(q) {
    const c = $("card"); c.innerHTML = "";
    c.append(el("p", "prompt", "Luister goed. Welk getal hoor je?"));
    const sp = el("button", "speak huge", "🔊"); sp.setAttribute("aria-label", "Hoor het getal");
    sp.onclick = () => sayGetal(q.n); c.append(sp);
    keuzes(c, shuffle(getalOpties(q.n, q.tot)), q.n, o => o, { cls: "text num", goed: (b) => { b.innerHTML = q.n + "<small>" + q.ding.repeat(Math.min(q.n, 5)) + (q.n > 5 ? "…" : "") + "</small>"; }, fout: o => sayGetal(o) });
    setTimeout(() => sayGetal(q.n), 350);
  },
  /* plus- en minsommen met plaatjes */
  som(q) {
    const c = $("card"); c.innerHTML = "";
    const ding = pick(DINGEN);
    const zin = `${NL[q.a]} ${q.op === "+" ? "plus" : "min"} ${NL[q.b]}`;
    c.append(el("p", "prompt", q.op === "+" ? "Hoeveel zijn het samen?" : "Hoeveel blijven er over?"));
    const sum = el("div", "sum");
    if (q.op === "+") {
      sum.append(el("div", "group", ding.repeat(q.a)), el("span", "op", "+"), el("div", "group", ding.repeat(q.b)));
    } else {
      const g = el("div", "group");
      for (let k = 0; k < q.a; k++) g.append(el("span", k >= q.a - q.b ? "gone" : "", ding));
      sum.append(g);
    }
    c.append(sum);
    const sp = el("button", "speak", `🔊 <span class="sum-text">${q.a} ${q.op} ${q.b} = ?</span>`); sp.onclick = () => say(zin); c.append(sp);
    keuzes(c, getalOpties(q.n, q.tot), q.n, o => o, { cls: "text num", goed: () => say(`${zin} is ${NL[q.n]}`, { rate: 0.9 }), fout: o => sayGetal(o), naGoed: true });
    setTimeout(() => say(zin), 350);
  },
};

/* ---------- einde ronde ---------- */
function finish() {
  drawDots();
  const { vak, li } = round, levels = VAKKEN[vak].levels;
  const st = round.mistakes <= 1 ? 3 : round.mistakes <= 4 ? 2 : 1;
  const wasOpen = open(vak, li + 1);
  P.levels[lk(vak, li)] = Math.max(P.levels[lk(vak, li)] || 0, st);
  geefXp(st * XP_PER_STER);
  bewaar();
  const nieuwDoel = LEERDOELEN.find(d => d.vak === vak && d.levels.includes(levelId(vak, li)) && doelStatus(d).stand === "behaald" && !round.doelWasBehaald);
  const c = nieuweKaart();
  const s = stem();
  c.append(el("div", "hello", s.plaatje));
  c.append(el("h1", "title", "Goed gedaan, " + speler().naam + "!"));
  const stars = el("div", "result-stars");
  for (let k = 0; k < 3; k++) { const x = el("span", k < st ? "on" : "", "★"); x.style.animationDelay = (0.2 + k * 0.35) + "s"; stars.append(x); }
  c.append(stars);
  c.append(el("p", "xp-total", `⚡ +${round.xp} XP <small>(totaal ${P.xp} · Lvl ${rang(P.xp)})</small>`));
  if (round.newStickers.length) {
    c.append(el("p", "prompt", "Nieuwe stickers!"));
    const g = el("div", "stickers small");
    round.newStickers.forEach(q => g.append(el("div", "sticker got", `<b>${q.item.plaatje}</b><span>${q.item.woord || q.item.en}</span>`)));
    c.append(g);
  }
  if (nieuwDoel) c.append(el("p", "unlock", "🎯 Leerdoel behaald: " + nieuwDoel.doel));
  const hasNext = li + 1 < levels.length;
  if (hasNext && !wasOpen) c.append(el("p", "unlock", "🔓 Level " + (li + 2) + " is open!"));
  const btns = el("div", "btns");
  if (hasNext) { const nx = el("button", "go", "Verder ➜"); nx.onclick = () => { say(levels[li + 1].naam); startRound(vak, li + 1); }; btns.append(nx); }
  const again = el("button", "go alt", "Nog een keer"); again.onclick = () => startRound(vak, li);
  btns.append(again);
  c.append(btns);
  praat(metNaam(s.klaar));
  yay(); setTimeout(yay, 450);
  confetti();
}
function confetti() {
  const box = el("div", "confetti"); document.body.append(box);
  const bits = ["⭐", "🎉", stem().plaatje, "🌟", "🎈"];
  for (let i = 0; i < 28; i++) {
    const s = el("span", null, pick(bits));
    s.style.left = Math.random() * 100 + "vw";
    s.style.animationDelay = Math.random() * 0.8 + "s";
    box.append(s);
  }
  setTimeout(() => box.remove(), 2800);
}

const HERTEKEN = { spelers: spelersKiezen, ranglijst, home, stem: stemKiezen, stickers: stickerboek, doelen: leerdoelen, meenemen };
$("homeBtn").onclick = home;
spelersKiezen();
koppel();
</script>
